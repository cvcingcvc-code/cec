# Gorgon Workbench CI — test → web build → Android release APK.
#
# OPT (2026-10-21): the build/publish chain used to be a ~15-step manual
# ritual on one machine (custom GRADLE_USER_HOME, hand-copied keystore,
# manual gh release + SHA256 verify). This workflow runs the same chain on
# every push to the delivery branches:
#
#   1. pipeline unit tests (python -m unittest, ~480 tests)
#   2. app unit tests (node --test "tests/*.test.mjs", ~591 tests)
#   3. vite production build + build smoke
#   4. gradle assembleRelease — signed when the KEYSTORE_* secrets are
#      configured, debug-signed otherwise (build.gradle's documented
#      fallback), so the pipeline is useful before secrets exist
#   5. branch push -> APK uploaded as a workflow artifact
#      tag push (v*)    -> APK attached to a GitHub Release
#
# REQUIRED SECRETS (repo Settings → Secrets and variables → Actions) for a
# SIGNED release — generate KEYSTORE_BASE64 with:
#   base64 -w0 app/android/app/gorgon-release.keystore   (Git Bash / Linux)
#   certutil -encode <file> <out>                        (Windows, strip headers)
#   KEYSTORE_BASE64      the gorgon-release.keystore file, base64-encoded
#   KEYSTORE_PASSWORD    keystore.properties storePassword
#   KEYSTORE_KEY_ALIAS   keystore.properties keyAlias (gorgon)
#   KEYSTORE_KEY_PASSWORD keystore.properties keyPassword
#
# The runner's ANDROID_HOME supplies the SDK; no local.properties is needed
# (gradle falls back to ANDROID_HOME when the file is absent).

name: ci

on:
  push:
    branches: [main, master, "feat/v3j-device-fix", "feat/v3i-android-full-delivery"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # compileSdk 36: the runner ships a base SDK; ensure platform 36 +
      # build-tools 36 exist. android-actions/setup-android v3 is NOT used —
      # its internal sdkmanager call died with "Failed to find package
      # 'tools'" on the runner's cmdline-tools 16.0 (runs 39578359243 /
      # 39578618682). Licenses accepted non-interactively ('yes |') first.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android platform 36 + build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "android-36|build-tools;36" || true

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # -- 1. pipeline unit tests (scratch data root — the suite must NOT
      #      dirty the tracked dataset; env isolation is built in since
      #      commit 3a1b119) ---------------------------------------------
      - name: Pipeline unit tests
        run: python -m unittest discover -s pipeline -t . -v

      # -- 2. app deps + unit tests ---------------------------------------
      # npm ci MUST precede the app tests: the suite imports esbuild/react
      # from node_modules, and the cache can miss after a lockfile change —
      # without ci first, tests die with ERR_MODULE_NOT_FOUND (run
      # 39581328369).
      - name: npm ci
        working-directory: app
        run: npm ci

      - name: App unit tests
        working-directory: app
        run: node --test "tests/*.test.mjs"

      # -- 3. web build + smoke ------------------------------------------
      - name: Vite production build
        working-directory: app
        run: npm run build

      - name: Build smoke
        working-directory: app
        run: node tests/build-smoke.mjs

      # -- 3b. browser E2E (the chromium fallback in cdp_session.mjs makes
      #      this runnable on the runner's Google Chrome; the demo-mode API
      #      server needs no dataset) --------------------------------------
      - name: Browser E2E (64 checks, 4 widths)
        working-directory: app
        env:
          CI: true
        run: GORGON_PYTHON=python node tests/e2e_v1_frontend.mjs

      # -- 4. Android release APK ------------------------------------------
      - name: Restore signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_* secrets not configured — building DEBUG-SIGNED APK (installable, not the release key)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/gorgon-release.keystore
          {
            echo "storeFile=gorgon-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > app/android/keystore.properties
          echo "release signing credentials restored (alias: $KEYSTORE_KEY_ALIAS)"

      # cap sync regenerates the gitignored pieces the Android build reads:
      # capacitor-cordova-android-plugins/ (cordova.variables.gradle) and
      # app/src/main/assets/public (the web bundle). A fresh checkout has
      # neither — gradle died on the missing script (run 39583666268).
      - name: Capacitor sync (android)
        working-directory: app
        run: npx cap sync android

      - name: Gradle assembleRelease
        working-directory: app/android
        run: |
          # gradle.properties hardcodes the LOCAL Clash proxy (127.0.0.1:7890)
          # for this machine's builds — on a CI runner nothing listens there,
          # so the wrapper download dies with Connection refused (run
          # 39583076370, 3/3 retries). Strip the proxy lines in CI only;
          # the local file is untouched. GitHub runners reach Maven Central
          # and services.gradle.org directly.
          sed -i '/^systemProp\.\(https\?\.\)\?proxy\(Host\|Port\)=/d; /^systemProp\.\(https\?\.\)\?nonProxyHosts=/d' gradle.properties
          grep -c systemProp gradle.properties || echo "proxy lines stripped"
          chmod +x gradlew
          ok=0
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --console=plain; then ok=1; break; fi
            echo "::warning::gradle attempt $attempt failed (wrapper download is a bare TCP fetch — a transient refusal is retried)"
            sleep 20
          done
          [ "$ok" = 1 ]

      - name: Verify APK signature + version
        if: success()
        working-directory: app/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -la "$APK"
          echo "versionCode/Name:"
          cat app/build/outputs/apk/release/output-metadata.json | grep -E "versionCode|versionName"
          VERSION=$(grep -o '"versionName": "[^"]*"' app/build/outputs/apk/release/output-metadata.json | cut -d'"' -f4)
          CODE=$(grep -o '"versionCode": [0-9]*' app/build/outputs/apk/release/output-metadata.json | grep -o '[0-9]*')
          cp "$APK" "../../gorgon-workbench-v${VERSION}-vc${CODE}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gorgon-workbench-apk
          path: gorgon-workbench-v*-vc*.apk
          if-no-files-found: error

      # -- 5. tag push -> attach APK to a GitHub Release -------------------
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gorgon-workbench-v*-vc*.apk
          generate_release_notes: true
